<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0A0C10" />
    <title>Quantum — DSECT</title>
    <script>
      // Pre-paint theme: DSECT is dark-first. Read the persisted choice (set by
      // src/theme.ts) before first paint so there is no light flash. Dark is
      // the default; the markup default above matches.
      try {
        var t = localStorage.getItem('quantum.theme');
        document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
