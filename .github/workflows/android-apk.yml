name: Android APK

on:
  workflow_dispatch:
  # Every main push refreshes the rolling `latest` release, which is what
  # the in-app updater checks. Weekly schedule kept as a backstop.
  push:
    branches: [main]
  schedule:
    # Weekly debug build, Mondays 09:00 UTC
    - cron: "0 9 * * 1"

# contents: write is required for the rolling-release publish step below.
permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The DSECT component kit lives in the vendor/design-system
          # submodule; without it @dsect/ui imports cannot resolve.
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Node 22+ required: undici 8 (via jsdom 30) uses
          # worker_threads.markAsUncloneable, added in Node 22.3.0.
          node-version: 24
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Capacitor 8 requires Java 21 to compile.
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Sync Android platform
        run: npx cap sync android

      - name: Set Android versionCode / versionName
        run: |
          VERSION_CODE="${{ github.run_number }}"
          VERSION_NAME="$(date -u +%Y.%m.%d)-${{ github.run_number }}"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          sed -i "s/versionCode 1/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i "s|versionName \"1.0\"|versionName \"$VERSION_NAME\"|" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: quantum-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Write version.json
        run: |
          cat > version.json <<EOF
          {
            "versionCode": ${{ env.VERSION_CODE }},
            "versionName": "${{ env.VERSION_NAME }}",
            "commitSha": "${{ github.sha }}",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat version.json

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_PATH="$(ls android/app/build/outputs/apk/debug/*.apk | head -1)"
          NOTES="$(printf 'Experimental build of Quantum.\n\n- versionName: %s\n- versionCode: %s\n- commit: %s\n- built: %s UTC\n\nRecent changes:\n%s' \
            "${{ env.VERSION_NAME }}" "${{ env.VERSION_CODE }}" "${{ github.sha }}" \
            "$(date -u '+%Y-%m-%d %H:%M')" \
            "$(git log -8 --pretty=format:'- %s')")"
          # One moving target: delete the old `latest` release (and its tag),
          # then re-create it with the fresh APK + version.json.
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest \
            --prerelease \
            --title "Experimental build" \
            --notes "$NOTES" \
            "$APK_PATH" version.json
          gh release view latest --json tagName,assets --jq \
            '{tag: .tagName, assets: [.assets[].name]}'
