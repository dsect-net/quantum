name: Android APK

on:
  workflow_dispatch:
  schedule:
    # Weekly debug build, Mondays 09:00 UTC
    - cron: "0 9 * * 1"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Sync Android platform
        run: npx cap sync android

      - name: Set Android versionCode / versionName
        run: |
          VERSION_CODE="${{ github.run_number }}"
          VERSION_NAME="$(date -u +%Y.%m.%d)-${{ github.run_number }}"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          sed -i "s/versionCode 1/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i "s|versionName \"1.0\"|versionName \"$VERSION_NAME\"|" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: quantum-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
